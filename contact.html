    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <header id="header">
        <nav class="container">
            <div class="logo">SANA<span>.</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>

                <li><a href="index.html#portfolio">Work</a></li>

            </ul>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <div class="contact-layout">
                    <div class="contact-info reveal">
                        <h1 class="highlight-gold">Get In Touch</h1>
                        <p>Have a project or just want to say hi? I'd love to hear from you.</p>
                        
                        <div class="info-item">
                            <h3>Location</h3>
                            <p>Hyderabad, India</p>
                        </div>
                        <div class="info-item">
                            <h3>Email</h3>
                            <p>sanafatiha0210@gmail.com</p>
                        </div>
                        <div class="info-item">
                            <h3>Phone</h3>
                            <p>+91-7075604987</p>
                        </div>
                        <div class="social-icons">
                            <a href="https://linkedin.com/in/sanafatiha0210" target="_blank">LinkedIn</a>
                            <a href="https://github.com/fatiha02" target="_blank">GitHub</a>
                        </div>
                    </div>
                    
                    <div class="contact-form-container reveal">
                        <form class="contact-form">
                            <div class="form-group">
                                <label>Your Name</label>
                                <input type="text" placeholder="e.g. John Doe" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" placeholder="e.g. john@example.com" required>
                            </div>
                            <div class="form-group">
                                <label>Subject</label>
                                <input type="text" placeholder="Project Inquiry" required>
                            </div>
                            <div class="form-group">
                                <label>Message</label>
                                <textarea rows="5" placeholder="How can I help you?" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <div class="logo">SANA<span>.</span></div>
                <p class="copyright">&copy; 2026 Sana Fatiha. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
