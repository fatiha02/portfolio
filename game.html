<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gaming | Play Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #020617; --gold: #fbbf24; --text: #f8fafc; }
        body { background: var(--dark); color: var(--text); font-family: 'Sora', sans-serif; margin: 0; }
        .nav { padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; }
        .hero { height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('project2.png') center/cover; }
        .hero h1 { font-size: 4rem; text-transform: uppercase; letter-spacing: 5px; color: var(--gold); margin: 0; }
        .games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 50px; }
        .game-card { position: relative; height: 300px; background: #1e293b; border-radius: 12px; overflow: hidden; border: 2px solid transparent; transition: 0.3s; }
        .game-card:hover { border-color: var(--gold); transform: scale(1.05); }
        .game-info { position: absolute; bottom: 20px; left: 20px; }
        .play-btn { background: var(--gold); border: none; padding: 12px 30px; border-radius: 4px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="nav">
        <div style="font-size:2rem; font-weight:800; color:var(--gold)">NEXUS</div>
        <a href="index.html" style="color:white; text-decoration:none">Back to Portfolio</a>
    </div>
    <div class="hero">
        <h1>Level Up Your Reality</h1>
        <p>The universe's most immersive browser games.</p>
        <button class="play-btn">START PLAYING</button>
    </div>
    <div class="games-grid">
        <div class="game-card"><div class="game-info"><h3>Void Runner</h3><button class="play-btn">PLAY</button></div></div>
        <div class="game-card"><div class="game-info"><h3>Gold Rush AI</h3><button class="play-btn">PLAY</button></div></div>
        <div class="game-card"><div class="game-info"><h3>Cyber Siege</h3><button class="play-btn">PLAY</button></div></div>
    </div>
</body>
</html>
